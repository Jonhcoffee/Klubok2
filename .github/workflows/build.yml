name: Build APK from zip
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать самый свежий zip
        run: |
          ZIP="$(ls -t *.zip | head -1)"
          unzip -q "$ZIP" -d src
      - name: Найти проект
        id: p
        run: |
          S="$(find src -name settings.gradle.kts | head -1)"
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"
      - name: Починить код
        run: |
          F1="$(find src -name ChatScreen.kt | head -1)"
          F2="$(find src -name Screens.kt | head -1)"
          sed -i '21s/\.matchParentSize()/.fillMaxSize()/' "$F1"
          sed -i '16s/\.matchParentSize()/.fillMaxSize()/' "$F2"
          for f in "$F1" "$F2"; do
            grep -qF "import androidx.compose.foundation.layout.fillMaxSize" "$f" || sed -i '0,/^package .*/s//&\n\nimport androidx.compose.foundation.layout.fillMaxSize/' "$f"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Собрать APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee build.log || { echo "=== ОШИБКИ ==="; grep -E "^e: " build.log | head -60; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: klubok-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

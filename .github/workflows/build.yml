name: Build APK from zip
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать самый свежий zip
        run: |
          ZIP="$(ls -t *.zip | head -1)"
          unzip -q "$ZIP" -d src
      - name: Найти проект
        id: p
        run: |
          S="$(find src -name settings.gradle.kts | head -1)"
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Собрать APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: klubok-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
